name: 卡农羊毛监控

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取并推送
        env:
          WXP_SPT: ${{ secrets.WXP_SPT }}
        run: python kanong.py once

      - name: 保存去重记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "no new items"
          fi
